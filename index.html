<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Віка П. — крута?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 26px;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #fff;
            margin: 0 auto 20px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option {
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            padding: 16px;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
            position: relative;
            overflow: hidden;
        }

        .option:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }

        .option.selected {
            border-color: #667eea;
            background: #eef1ff;
            font-weight: 600;
        }

        .option .bar {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: rgba(102, 126, 234, 0.15);
            width: 0;
            transition: width 0.8s ease;
            z-index: 0;
        }

        .option .label {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
        }

        .pct {
            color: #667eea;
            font-weight: 700;
        }

        button.vote {
            margin-top: 26px;
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
        }

        button.vote:hover {
            transform: translateY(-2px);
        }

        button.vote:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .thanks {
            margin-top: 20px;
            color: #28a745;
            font-weight: 600;
            display: none;
        }

        .total {
            margin-top: 14px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="avatar">😎</div>
    <h1>Віка П. — крута?</h1>
    <p class="subtitle">Проголосуй, будь ласка 🙌</p>

    <div class="options" id="options"></div>

    <button class="vote" id="voteBtn" disabled>Проголосувати</button>
    <p class="thanks" id="thanks">Дякуємо за голос! 🎉</p>
    <p class="total" id="total"></p>
</div>

<script>
    const votes = {"Так, дуже!": 42, "Звісно, крута": 37, "Неймовірна": 51};
    let userVote = null;
    const voted = localStorage.getItem('vika_voted') === 'true';

    const optionsEl = document.getElementById('options');
    const voteBtn = document.getElementById('voteBtn');
    const thanks = document.getElementById('thanks');

    function totalVotes() {
        return Object.values(votes).reduce((a, b) => a + b, 0);
    }

    function render(showResults) {
        optionsEl.innerHTML = '';
        const total = totalVotes();

        Object.keys(votes).forEach(key => {
            const pct = total ? Math.round(votes[key] / total * 100) : 0;
            const div = document.createElement('div');
            div.className = 'option';
            div.dataset.key = key;

            div.innerHTML = `
        <div class="bar"></div>
        <div class="label">
          <span>${key}</span>
          ${showResults ? <span class="pct">${pct}%</span> : ''}
        </div>
      `;

            if (showResults) {
                div.querySelector('.bar').style.width = pct + '%';
            } else {
                div.addEventListener('click', () => {
                    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                    div.classList.add('selected');
                    userVote = key;
                    voteBtn.disabled = false;
                });
            }
            optionsEl.appendChild(div);
        });

        document.getElementById('total').textContent = Всього
        голосів: ${total};
    }

    if (voted) {
        const saved = localStorage.getItem('vika_choice');
        userVote = saved;
        render(true);
        voteBtn.style.display = 'none';
        thanks.style.display = 'block';
    } else {
        render(false);
    }

    voteBtn.addEventListener('click', () => {
        if (!userVote) return;
        votes[userVote]++;
        localStorage.setItem('vika_voted', 'true');
        localStorage.setItem('vika_choice', userVote);
        render(true);
        voteBtn.style.display = 'none';
        thanks.style.display = 'block';
    });
</script>
</body>
</html>
